<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link rel="stylesheet" href="_ds/geniekreator-guidelines-1f4d6daa-0ebd-461a-8396-6f4c3ad9b031/tokens/fonts.css">
<style>body{margin:0;background:#ecebf0;font-family:'Manrope',system-ui,sans-serif}*{box-sizing:border-box}a{color:oklch(0.53 0.17 252)}a:hover{color:oklch(0.45 0.17 252)}.dv-turn{padding:40px 44px 32px;border-bottom:1px solid rgba(0,0,0,.08)}.dv-thd{display:flex;align-items:baseline;gap:10px;margin:0 0 20px}.dv-tid{font:600 10px ui-monospace,Menlo,monospace;padding:3px 7px;background:#1a1a1a;color:#fff;border-radius:4px;text-decoration:none}.dv-tname{font:600 13px/1.2 system-ui,sans-serif;color:#1a1a1a}.dv-opts{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start}.dv-opt{flex:none;display:flex;flex-direction:column;gap:9px}.dv-oid{font:600 10.5px ui-monospace,Menlo,monospace;padding:3px 7px;background:rgba(0,0,0,.08);color:#1a1a1a;border-radius:5px;text-decoration:none}.dv-olabel{display:flex;align-items:baseline;gap:8px;font:400 11px/1.3 system-ui,sans-serif;color:rgba(0,0,0,.55)}.dv-card{max-width:100%;background:#0A081B;border-radius:8px;overflow:hidden}.dv-opt:target .dv-oid{background:#2a78d6;color:#fff}</style>
</helmet>
<section class="dv-turn" style="padding-bottom:8px"><h1 style="margin:0; font-size:32px; font-weight:700; letter-spacing:-0.03em; color:#1a1a1a">iLead · System states</h1><p style="margin:8px 0 0; font-size:14px; color:rgba(0,0,0,.6)">Loading, empty, error, AI thinking and streaming, offline and mic denied. Main screens are in <a href="iLead Screens.dc.html">iLead Screens</a>.</p></section>
<sc-for list="{{ groups }}" as="g" hint-placeholder-count="4">
  <section class="dv-turn" id="{{ g.id }}">
    <div class="dv-thd"><a class="dv-tid" href="{{ g.href }}">{{ g.num }}</a><span class="dv-tname">{{ g.title }}</span></div>
    <div class="dv-opts">
      <sc-for list="{{ g.frames }}" as="f" hint-placeholder-count="3">
        <div class="dv-opt" id="{{ f.id }}">
          <div class="dv-olabel"><a class="dv-oid" href="{{ f.href }}">{{ f.id }}</a>{{ f.label }}</div>
          <div class="dv-card" style="width:{{ f.w }}"><dc-import name="iLeadApp" frozen="{{ f.frozen }}" screen="{{ f.screen }}" variant="{{ f.variant }}" ui-state="{{ f.ui }}" step="{{ f.step }}" capacity="{{ f.capacity }}" outcome="{{ f.outcome }}" mobile="{{ f.mobile }}" hint-size="{{ f.hint }}"></dc-import></div>
        </div>
      </sc-for>
    </div>
  </section>
</sc-for>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const F = (id, label, o = {}) => ({ id, href: '#' + id, label, frozen: id !== 'p1', w: o.mobile ? '390px' : '1440px', hint: o.mobile ? '390px,844px' : '1440px,900px', ...o });
    const G = [
      ['Loading and empty', [F('z1', 'Loading the office', { screen: 'board', ui: 'loading' }), F('z2', 'Inbox empty', { screen: 'board', ui: 'empty' })]],
      ['Board limits and connection', [F('z3', 'Out of days: actions lock, End week is the only primary button. Days left pulses at 1', { screen: 'board', capacity: 0 }), F('z4', 'Offline: clock paused, actions queue and retry', { screen: 'board', ui: 'offline' })]],
      ['AI thinking, streaming, slow and error', [
        F('z5', 'Listening, live transcript and waveform', { screen: 'live', variant: 'roleplay', ui: 'listening' }),
        F('z6', 'NPC thinking', { screen: 'live', variant: 'roleplay', ui: 'thinking' }),
        F('z7', 'NPC slow to reply, retry after 8 seconds', { screen: 'live', variant: 'roleplay', ui: 'slow' }),
        F('z8', 'Conversation reached a natural close', { screen: 'live', variant: 'roleplay', ui: 'done' }),
        F('z9', 'Evaluation taking longer than usual', { screen: 'reacting', ui: 'slow' }),
        F('z10', 'Hint used: one coaching tip per interaction', { screen: 'live', variant: 'roleplay', ui: 'hint' })]],
      ['Voice failures', [
        F('z11', 'Mic denied in the conversation. Banner and text fallback', { screen: 'live', variant: 'roleplay', ui: 'micDenied' }),
        F('z12', 'Poor audio, partial transcript to fix', { screen: 'live', variant: 'roleplay', ui: 'poorAudio' }),
        F('z13', 'Mic denied during voice setup', { screen: 'onboarding', step: 'voice', ui: 'micDenied' }),
        F('z14', 'Dictating into an email', { screen: 'live', variant: 'email', ui: 'dictating' }),
        F('z15', 'Offline during a conversation', { screen: 'live', variant: 'roleplay', ui: 'offline' })]]
    ];
    return { groups: G.map(([title, frames], i) => ({ id: 'sg' + i, href: '#sg' + i, num: String(i + 1), title, frames })) };
  }
}
</script>
</body>
</html>
