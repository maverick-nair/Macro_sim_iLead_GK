name: CI

# Independent jobs run side by side, and the end to end suite is split in six shards, so a run takes the
# time of its slowest shard instead of the sum of every step. A new push cancels the run it replaces.
# Jobs: static (tokens, lint, unit tests, types, build with the bundle budget, calibration, synthetic
# players), storybook (smoke), e2e (six shards, with axe), e2e-server,
# parity (design parity against the Claude Design prototype) and vitals (Web Vitals budgets on a
# throttled production build, alone on its runner so nothing else competes for the CPU).
on:
  push:
    branches: [main, ilead-participant, genie-authoring-calibration]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run tokens:check
      - run: npm run lint
      - run: npm run build
      - run: npm run calibrate -- sales-elevator --check
      - run: npm run synthetic -- --check

  storybook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run storybook:smoke

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/e2e-shard.mjs ${{ matrix.shard }} 6
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures-${{ matrix.shard }}
          path: test-results
          if-no-files-found: ignore

  e2e-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:server
      - run: npm run e2e:server

  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run parity
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: parity-diff
          path: .visual-cache/diff
          if-no-files-found: ignore

  vitals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run vitals -- --json vitals.json 2>&1 | tee vitals.log
      # The job's log is not readable from outside, so a failure also becomes an annotation.
      - if: failure()
        run: echo "::error title=vitals::$(tail -n 40 vitals.log | tr '\n' '|' | head -c 3000)"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vitals
          path: vitals.json
          if-no-files-found: ignore
