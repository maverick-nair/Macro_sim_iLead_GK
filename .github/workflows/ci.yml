name: CI

# Every push and pull request: tokens, lint, unit tests, types, build with the bundle budget,
# Storybook smoke, end to end flows with axe, design parity against the Claude Design prototype, and the
# Web Vitals budgets on a throttled production build.
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run tokens:check
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run storybook:smoke
      - run: npx playwright test
      - run: npm run parity
      - run: npm run vitals -- --json vitals.json
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failures
          path: |
            test-results
            vitals.json
            .visual-cache/diff
          if-no-files-found: ignore
