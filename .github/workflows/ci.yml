name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gk
          POSTGRES_PASSWORD: gk
          POSTGRES_DB: gk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://gk:gk@localhost:5432/gk_test?schema=public
      TEST_DATABASE_URL: postgresql://gk:gk@localhost:5432/gk_test?schema=public
      REDIS_URL: redis://localhost:6379
      AI_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm lint:copy
      - run: pnpm format:check
      - name: Exit check (M1)
        run: pnpm sim validate seed:ilead
      - run: pnpm test
      # pnpm e2e joins here in M3, when apps/web exists.
