<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>iLead, a Business Simulation</title>
    <!-- The headings' face loads with the scripts, not after the first render: the first screen's largest
         paint is a heading (D78), set in Newsreader's display cut on the canvas (D227). Only that face is
         preloaded: on a slow line a second preload would take bandwidth from the scripts the first paint waits
         for. Geist, Geist Mono and Newsreader's text cut swap in when they land. -->
    <link rel="preload" href="/fonts/Newsreader-Display.woff2" as="font" type="font/woff2" crossorigin />
    <!-- D87: the participant's first view (6 KB) leaves now, before the app's code has downloaded, so it is
         in when the code is (portraits wait for the code: on a slow network they would only slow it). The engine client
         takes this answer for its first view (src/engine/client.ts, takeEarlyView). Only with a server
         engine, only on the participant's route, and never while actions wait to be sent (D86). -->
    <script>
      (function () {
        var url = '__ILEAD_ENGINE_URL__';
        if (!url || url.charAt(0) === '_' || /^\/(screens|states|group)\/?$|^\/author(\/|$)/.test(location.pathname)) return;
        try {
          var q = new URLSearchParams(location.search);
          if (q.get('engine') === 'off' || q.get('preview') === '1') return;
          var p = q.get('participant');
          if (!p) { var run = JSON.parse(localStorage.getItem('ilead.run') || 'null'); p = (run && run.participant) || 'local'; }
          if (localStorage.getItem('ilead.pending.' + p)) return;
          var base = url.replace(/\/$/, '') + '/sessions/' + encodeURIComponent(p);
          var view = fetch(base + '/view', { credentials: 'include', headers: { 'content-type': 'application/json' } }).then(function (r) {
            if (!r.ok) throw new Error('view ' + r.status);
            return r.json();
          });
          view.catch(function () {});
          window.__ileadEarlyView = { session: p, view: view };
        } catch (e) { /* storage blocked or no fetch: the app asks for the view itself */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
