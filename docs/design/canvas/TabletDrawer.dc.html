          <span style="font-size: 13px; color: #A6AECB">{{a.c}}</span>
        </label>

    <span style="flex: 1"></span>
    <span style="font-size: 12px; color: #8C94B4; text-align: center">Live conversation · 1 of 2 this week · 3 days left</span>
