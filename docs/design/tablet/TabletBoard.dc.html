<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tablet board</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#0A0A1A}
.tile{padding:12px 14px;border-radius:14px;background:#12122A;border:1px solid rgba(222,233,255,0.08);display:flex;flex-direction:column;gap:6px;min-width:0}
.ib{width:44px;height:44px;border-radius:12px;border:1px solid rgba(222,233,255,0.12);background:rgba(222,233,255,0.03);color:#D6DBEE;display:flex;align-items:center;justify-content:center}

</style>
</helmet>
<div style="width: 834px; height: 1194px; box-sizing: border-box; background: radial-gradient(700px 500px at 50% 0%, #15163A 0%, #0A0A1A 70%); color: #F1F4FF; font-family: Manrope, sans-serif; display: flex; flex-direction: column">
  <header style="height: 72px; box-sizing: border-box; padding: 0 24px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(222,233,255,0.06)">
    <span style="font-size: 21px; font-weight: 800; letter-spacing: -0.03em">i<span style="color: #43D6E8">Lead</span></span>
    <span style="font-size: 14px; margin-left: 6px"><b>Week 3</b> <span style="color: #8C94B4">· Day 2 · 3 days left</span></span>
    <span style="flex: 1"></span>
    <button type="button" aria-label="Leadership Score 433" style="height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid rgba(222,233,255,0.12); background: transparent; color: #F1F4FF; font: 700 15px Manrope, sans-serif">★ 433</button>
    <button type="button" class="ib" aria-label="Pause, 18:42 played"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
    <button type="button" style="height: 44px; padding: 0 18px; border-radius: 12px; border: 0; background: #2F9BFF; color: #04101F; font: 700 15px Manrope, sans-serif">End week 3</button>
  </header>
  <section aria-label="How the team is doing" style="padding: 16px 24px 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
    <sc-for list="{{kpis}}" as="k" hint-placeholder-count="8">
      <div class="tile"><span style="font-size: 12px; color: #A6AECB">{{k.n}}</span><div style="display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap"><b style="font-size: 21px; font-variant-numeric: tabular-nums">{{k.v}}</b><span style="font-size: 12px; font-weight: 700; color: {{k.c}}">{{k.d}}</span></div></div>
    </sc-for>
  </section>
  <main aria-label="Your team by stage" style="flex: 1; min-height: 0; padding: 18px 24px 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; align-content: start">
    <sc-for list="{{stages}}" as="s" hint-placeholder-count="5">
      <section aria-label="{{s.n}}" style="display: flex; flex-direction: column; gap: 10px; min-width: 0">
        <div style="padding: 10px 12px; border-radius: 12px; border: 1px solid {{s.border}}; background: {{s.bg}}; display: flex; flex-direction: column"><b style="font-size: 14px">{{s.n}}</b><span style="font-size: 12px; color: {{s.c}}">{{s.note}}</span></div>
        <sc-for list="{{s.people}}" as="m" hint-placeholder-count="2">
          <button type="button" aria-pressed="{{m.sel}}" style="min-height: 168px; padding: 14px 12px; border-radius: 18px; background: {{m.bg}}; border: 1px solid {{m.border}}; color: #F1F4FF; font-family: Manrope, sans-serif; text-align: left; display: flex; flex-direction: column; gap: 10px">
            <img src="{{m.img}}" alt="" style="width: 52px; height: 52px; border-radius: 50%; object-fit: cover; object-position: top; background: #DCE6F7; box-shadow: 0 0 0 2px {{m.ring}}">
            <span style="display: flex; flex-direction: column; gap: 2px"><b style="font-size: 15px; line-height: 1.25">{{m.n}}</b><span style="font-size: 12px; color: #8C94B4">{{m.r}}</span></span>
            <span style="display: flex; gap: 6px; align-items: center; flex-wrap: wrap"><span style="font-size: 12px; font-weight: 700; color: {{m.ring}}">{{m.mood}}</span><span style="height: 22px; padding: 0 8px; border-radius: 999px; background: rgba(222,233,255,0.07); font-size: 11px; font-weight: 700; display: flex; align-items: center; color: #C3C9DE">{{m.style}}</span></span>
          </button>
        </sc-for>
      </section>
    </sc-for>
  </main>
  <section aria-label="This week's outcome" style="margin: 18px 24px 0; padding: 16px 18px; border-radius: 18px; background: #12122A; border: 1px solid rgba(222,233,255,0.08); display: flex; gap: 14px; align-items: center">
    <span style="width: 40px; height: 40px; border-radius: 12px; background: rgba(46,230,168,0.14); color: #6FF2C4; display: flex; align-items: center; justify-content: center; font-weight: 800">▲</span>
    <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><b style="font-size: 15px">Beth took the lead on the Halden pitch</b><span style="font-size: 13px; color: #A6AECB">Entrusting fit her. Leads moved 4 ahead of pace.</span></span>
    <button type="button" style="height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid rgba(222,233,255,0.14); background: transparent; color: #F1F4FF; font: 600 14px Manrope, sans-serif">Why</button>
  </section>
  <nav aria-label="Board tools" style="margin: 16px 24px 24px; padding: 10px; border-radius: 20px; background: rgba(18,18,42,0.92); border: 1px solid rgba(222,233,255,0.1); box-shadow: 0 20px 50px rgba(0,0,0,0.4); display: flex; gap: 10px">
    <button type="button" style="height: 56px; padding: 0 20px; border-radius: 14px; border: 1px solid rgba(222,233,255,0.12); background: transparent; color: #F1F4FF; font: 700 15px Manrope, sans-serif; display: flex; align-items: center; gap: 10px">Inbox <span style="min-width: 24px; height: 24px; border-radius: 999px; background: #FF7A6B; color: #1A0805; font-size: 12px; display: flex; align-items: center; justify-content: center">3</span></button>
    <button type="button" style="flex: 1; height: 56px; border-radius: 14px; border: 0; background: linear-gradient(90deg, #2F9BFF, #43D6E8); color: #04101F; font: 800 16px Manrope, sans-serif">Actions · 8 open · 3 days left</button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":834,"height":1194}}'>

    const s = (n, note, people, b) => ({ n, note, people, border: b ? 'rgba(245,181,71,0.35)' : 'rgba(222,233,255,0.08)', bg: b ? 'rgba(245,181,71,0.08)' : 'transparent', c: b ? '#FFD08A' : '#8C94B4' });

        { n: 'Team result', v: '60', d: '▲ 3', c: '#6FF2C4' }, { n: 'Team trust', v: '56', d: 'steady', c: '#A6AECB' },

        s('Proposal', '5 of 6.4', [p('green', 'Green Bell', 'Proposals', 'Steady', 'Partnering'), p('lowe', 'Lowe Rex', 'Proposals', 'Concerned', 'Guiding')]),
        s('Negotiation', '1.8 of 2.7', [p('jack', 'Jack Holt', 'Negotiator', 'Upbeat', 'Partnering'), p('peter', 'Peter Higgins', 'Negotiator', 'Concerned', 'Directing')]),
        s('Conversion', 'Bottleneck', [p('ruth', 'Ruth Ether', 'Closer', 'Steady', 'Guiding'), p('mandy', 'Mandy Lobert', 'Closer', 'Upbeat', 'Entrusting')], true)

  }

</script>
</body>
</html>
