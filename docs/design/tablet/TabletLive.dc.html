<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tablet 1:1</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#0A0A1A}
.tile{padding:12px 14px;border-radius:14px;background:#12122A;border:1px solid rgba(222,233,255,0.08);display:flex;flex-direction:column;gap:6px;min-width:0}
.ib{width:44px;height:44px;border-radius:12px;border:1px solid rgba(222,233,255,0.12);background:rgba(222,233,255,0.03);color:#D6DBEE;display:flex;align-items:center;justify-content:center}

</style>
</helmet>
<div style="width: 834px; height: 1194px; box-sizing: border-box; background: radial-gradient(600px 500px at 50% 28%, #191A40 0%, #0A0A1A 70%); color: #F1F4FF; font-family: Manrope, sans-serif; display: flex; flex-direction: column">
  <header style="height: 72px; box-sizing: border-box; padding: 0 24px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(222,233,255,0.06)">
    <div style="display: flex; flex-direction: column; flex: 1"><h1 style="margin: 0; font-size: 18px">1:1 with Kent Goldberg</h1><span style="font-size: 13px; color: #8C94B4">Meet face to face · 4:12 left</span></div>
    <button type="button" style="height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid rgba(222,233,255,0.14); background: transparent; color: #F1F4FF; font: 600 14px Manrope, sans-serif">Hint</button>
    <button type="button" class="ib" aria-label="Pause"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
    <button type="button" style="height: 44px; padding: 0 18px; border-radius: 12px; border: 1px solid rgba(222,233,255,0.2); background: transparent; color: #F1F4FF; font: 700 14px Manrope, sans-serif">End conversation</button>
  </header>
  <div style="padding: 28px 24px 12px; display: flex; gap: 24px; align-items: center">
    <div style="width: 200px; height: 200px; flex: none; border-radius: 50%; padding: 5px; background: conic-gradient(#43D6E8, #2F9BFF, #43D6E8); box-shadow: 0 24px 70px rgba(47,155,255,0.25)"><img src="/_blob/591e30ff8363f46b3929b9e1cc60c1d3" alt="Kent Goldberg" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover; object-position: top; background: #DCE6F7; display: block"></div>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="align-self: flex-start; height: 28px; padding: 0 12px; border-radius: 999px; background: rgba(255,122,107,0.14); color: #FFA79C; font-size: 13px; font-weight: 700; display: flex; align-items: center">Kent seems frustrated</span>
      <b style="font-size: 22px; line-height: 1.25">Your goal: understand what is behind the drop in Kent's leads.</b>
      <span style="font-size: 14px; color: #A6AECB">Style you set this week: Guiding</span>
    </div>
  </div>
  <div role="log" aria-label="Conversation" style="flex: 1; min-height: 0; overflow: hidden; padding: 12px 24px; display: flex; flex-direction: column; gap: 12px">
    <sc-for list="{{turns}}" as="t" hint-placeholder-count="4">
      <div style="display: flex; flex-direction: column; gap: 4px; align-items: {{t.al}}"><span style="max-width: 560px; padding: 12px 16px; border-radius: 18px; background: {{t.bg}}; font-size: 16px; line-height: 1.5">{{t.text}}</span><span style="font-size: 12px; color: #8C94B4">{{t.meta}}</span></div>
    </sc-for>
  </div>
  <footer style="padding: 12px 24px 28px">
    <div style="display: flex; gap: 12px; align-items: flex-end; padding: 12px; border-radius: 22px; background: #12122A; border: 1px solid #43D6E8">
      <div style="flex: 1; display: flex; flex-direction: column; gap: 4px; padding: 2px 6px">
        <label for="r" style="font-size: 12px; font-weight: 700; color: #43D6E8">Listening. Edit, then send</label>
        <textarea id="r" rows="2" style="background: transparent; border: 0; color: #F1F4FF; font: 500 16px/1.5 Manrope, sans-serif; resize: none; outline: none">That sounds hard. What would make the split feel fair to you?</textarea>
      </div>
      <button type="button" aria-label="Stop recording" style="width: 56px; height: 56px; border-radius: 50%; border: 0; background: #43D6E8; color: #04101F; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
      <button type="button" aria-label="Send" style="width: 56px; height: 56px; border-radius: 50%; border: 0; background: #2F9BFF; color: #04101F; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </div>
  </footer>
</div>
</x-dc>

      { text: 'Thanks for making time. How are things this week?', al: 'flex-end', bg: 'rgba(47,155,255,0.2)', meta: 'You · by voice' },

      { text: 'I hear you. Tell me more about how the split works day to day.', al: 'flex-end', bg: 'rgba(47,155,255,0.2)', meta: 'You · by voice' }
    ] };
  }
}
</script>
</body>
</html>
